<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagger Pro - Precision EXIF Editor</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Piexifjs for EXIF manipulation -->
    <script src="https://unpkg.com/piexifjs@1.0.6/piexif.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .map-container { height: 400px; width: 100%; border-radius: 0.5rem; z-index: 1; }
        .leaflet-tile { visibility: inherit !important; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        
        @keyframes flash { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        .camera-flash { animation: flash 0.2s ease-out; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Upload = (p) => <IconBase {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></IconBase>;
        const MapPin = (p) => <IconBase {...p}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></IconBase>;
        const Download = (p) => <IconBase {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></IconBase>;
        const Search = (p) => <IconBase {...p}><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></IconBase>;
        const ImageIcon = (p) => <IconBase {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></IconBase>;
        const Info = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></IconBase>;
        const MapIcon = (p) => <IconBase {...p}><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6" /><line x1="8" y1="2" x2="8" y2="18" /><line x1="16" y1="6" x2="16" y2="22" /></IconBase>;
        const Layers = (p) => <IconBase {...p}><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></IconBase>;
        const Camera = (p) => <IconBase {...p}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></IconBase>;
        const X = (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></IconBase>;
        const SwitchCamera = (p) => <IconBase {...p}><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" /><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5" /><circle cx="12" cy="12" r="3" /></IconBase>;
        const Settings = (p) => <IconBase {...p}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></IconBase>;
        const Layout = (p) => <IconBase {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="9" y1="21" x2="9" y2="9" /></IconBase>;
        const Calendar = (p) => <IconBase {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></IconBase>;
        const Crosshair = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10" /><line x1="22" y1="12" x2="18" y2="12" /><line x1="6" y1="12" x2="2" y2="12" /><line x1="12" y1="6" x2="12" y2="2" /><line x1="12" y1="22" x2="12" y2="18" /></IconBase>;

        // --- Helper Functions ---

        const toRational = (number) => {
            const gcd = (a, b) => (!b ? a : gcd(b, a % b));
            const fraction = number.toString().split('.');
            if (fraction.length === 1) return [number, 1];
            const b = Math.pow(10, fraction[1].length);
            const a = Math.round(number * b);
            const common = gcd(Math.abs(a), b);
            return [a / common, b / common];
        };

        const degToDmsRational = (deg) => {
            const absolute = Math.abs(deg);
            let degrees = Math.floor(absolute);
            let minutes = Math.floor((absolute - degrees) * 60);
            let seconds = ((absolute - degrees) * 60 - minutes) * 60;
            const denominator = 10000;
            let secNumerator = Math.round(seconds * denominator);
            if (secNumerator >= 60 * denominator) { secNumerator = 0; minutes += 1; }
            if (minutes >= 60) { minutes = 0; degrees += 1; }
            return [[degrees, 1], [minutes, 1], [secNumerator, denominator]];
        };

        const getTileCoords = (lat, lon, zoom) => {
            const x = (lon + 180) / 360 * Math.pow(2, zoom);
            const latRad = lat * Math.PI / 180;
            const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * Math.pow(2, zoom);
            return { x, y };
        }

        const hexToRgb = (hex) => {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
        }

        const drawCanvasIcon = (ctx, type, x, y, size, color) => {
            ctx.save();
            ctx.translate(x, y);
            ctx.strokeStyle = color;
            ctx.lineWidth = size / 12;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();

            if (type === 'gps') {
                // Crosshair
                const r = size/2;
                ctx.arc(size/2, size/2, r*0.65, 0, Math.PI*2);
                ctx.moveTo(size/2, 0); ctx.lineTo(size/2, size*0.25);
                ctx.moveTo(size/2, size); ctx.lineTo(size/2, size*0.75);
                ctx.moveTo(0, size/2); ctx.lineTo(size*0.25, size/2);
                ctx.moveTo(size, size/2); ctx.lineTo(size*0.75, size/2);
            } else if (type === 'date') {
                // Calendar
                ctx.rect(size*0.15, size*0.2, size*0.7, size*0.7);
                ctx.moveTo(size*0.3, size*0.1); ctx.lineTo(size*0.3, size*0.3);
                ctx.moveTo(size*0.7, size*0.1); ctx.lineTo(size*0.7, size*0.3);
                ctx.moveTo(size*0.15, size*0.4); ctx.lineTo(size*0.85, size*0.4);
            } else if (type === 'location') {
                // Pin
                ctx.moveTo(size*0.5, size*0.9);
                ctx.bezierCurveTo(size*0.5, size*0.9, size*0.85, size*0.55, size*0.85, size*0.4);
                ctx.arc(size*0.5, size*0.4, size*0.35, Math.PI*0.1, Math.PI*0.9, true);
                ctx.closePath();
                // small dot inside
                // ctx.moveTo(size*0.6, size*0.4);
                // ctx.arc(size*0.5, size*0.4, size*0.1, 0, Math.PI*2);
            }
            ctx.stroke();
            ctx.restore();
        };

        const MAP_PROVIDERS = {
            satellite: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attribution: 'Esri World Imagery' },
            street: { url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', attribution: 'OpenStreetMap' }
        };

        // --- Main Component ---

        function App() {
            const [imageFile, setImageFile] = useState(null);
            const [imagePreview, setImagePreview] = useState(null);
            const [coords, setCoords] = useState({ lat: 51.505, lng: -0.09 });
            const [zoom, setZoom] = useState(13);
            const [address, setAddress] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [isSearching, setIsSearching] = useState(false);
            const [originalExif, setOriginalExif] = useState(null);
            const [mapType, setMapType] = useState('satellite'); 
            const [isDownloading, setIsDownloading] = useState(false);
            
            // Camera
            const [isCameraOpen, setIsCameraOpen] = useState(false);
            const [isCameraLoading, setIsCameraLoading] = useState(false);
            const [cameraFacingMode, setCameraFacingMode] = useState('environment'); 
            
            // Settings
            const [overlaySettings, setOverlaySettings] = useState({
                enabled: true,
                includeMap: true,
                customText: '',
                bgColor: '#000000',
                bgOpacity: 75,
                textColor: '#ffffff',
                accentColor: '#3B82F6', // Changed default to a nicer blue
                fontSize: 1, 
                showDate: true,
                showCoords: true,
                showAddress: true,
                layoutMode: 'footer', 
                position: 'bottom-right', 
                mapAlign: 'left', 
                customDate: '' 
            });

            // Refs
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markerRef = useRef(null);
            const tileLayerRef = useRef(null);
            const fileInputRef = useRef(null);
            const videoRef = useRef(null);
            const streamRef = useRef(null);

            // Clean up Blob URLs to avoid memory leaks
            useEffect(() => {
                return () => {
                    if (imagePreview && imagePreview.startsWith('blob:')) {
                        URL.revokeObjectURL(imagePreview);
                    }
                };
            }, [imagePreview]);

            // --- Map Logic ---
            useEffect(() => {
                if (!imageFile || !mapRef.current) return;
                if (mapInstanceRef.current) return;

                const map = L.map(mapRef.current).setView([coords.lat, coords.lng], 13);
                tileLayerRef.current = L.tileLayer(MAP_PROVIDERS[mapType].url, {
                    attribution: MAP_PROVIDERS[mapType].attribution, maxZoom: 19 
                }).addTo(map);

                const marker = L.marker([coords.lat, coords.lng], { draggable: true }).addTo(map);
                marker.on('dragend', function(event) {
                    const position = marker.getLatLng();
                    updateCoordinates(position.lat, position.lng);
                });
                map.on('click', function(e) {
                    marker.setLatLng(e.latlng);
                    updateCoordinates(e.latlng.lat, e.latlng.lng);
                });

                mapInstanceRef.current = map;
                markerRef.current = marker;

                return () => {
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                        markerRef.current = null;
                    }
                };
            }, [imageFile]);

            useEffect(() => {
                if (mapInstanceRef.current && tileLayerRef.current) {
                    tileLayerRef.current.setUrl(MAP_PROVIDERS[mapType].url);
                }
            }, [mapType]);

            useEffect(() => {
                if (mapInstanceRef.current && markerRef.current) {
                    const latNum = parseFloat(coords.lat);
                    const lngNum = parseFloat(coords.lng);
                    if (!isNaN(latNum) && !isNaN(lngNum)) {
                        const currentCenter = mapInstanceRef.current.getCenter();
                        const dist = Math.sqrt(Math.pow(currentCenter.lat - latNum, 2) + Math.pow(currentCenter.lng - lngNum, 2));
                        if (dist > 0.00001) {
                             const currentZoom = mapInstanceRef.current.getZoom();
                             mapInstanceRef.current.setView([latNum, lngNum], currentZoom);
                        }
                        markerRef.current.setLatLng([latNum, lngNum]);
                    }
                }
            }, [coords]);

            // --- Actions ---
            const updateCoordinates = async (lat, lng) => {
                setCoords({ lat, lng });
                const latNum = parseFloat(lat);
                const lngNum = parseFloat(lng);

                if (!isNaN(latNum) && !isNaN(lngNum)) {
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latNum}&lon=${lngNum}&zoom=18&addressdetails=1`);
                        const data = await response.json();
                        if (data && data.address) {
                            const a = data.address;
                            const parts = [];
                            if (a.house_number) parts.push(a.house_number);
                            if (a.road) parts.push(a.road);
                            else if (a.pedestrian) parts.push(a.pedestrian);
                            else if (a.building) parts.push(a.building);
                            else if (a.amenity) parts.push(a.amenity);
                            
                            if (a.neighbourhood) parts.push(a.neighbourhood);
                            else if (a.suburb) parts.push(a.suburb);
                            
                            if (a.state_district) parts.push(a.state_district);
                            else if (a.district) parts.push(a.district);
                            else if (a.city_district) parts.push(a.city_district);
                            
                            if (parts.length < 3 && a.city) parts.push(a.city);
                            if (a.state) parts.push(a.state);
                            if (a.country) parts.push(a.country);

                            const finalAddress = parts.length > 0 ? parts.join(', ') : data.display_name;
                            setAddress(finalAddress);
                        } else if(data && data.display_name) {
                            const parts = data.display_name.split(',');
                            setAddress(parts.slice(0, 4).join(', '));
                        }
                    } catch (e) {
                        console.error("Geocoding failed", e);
                    }
                }
            };

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!searchQuery) return;
                setIsSearching(true);
                const parts = searchQuery.split(/[\s,]+/).filter(p => p.trim() !== '');
                if (parts.length === 2) {
                    const lat = parseFloat(parts[0]);
                    const lng = parseFloat(parts[1]);
                    if (!isNaN(lat) && !isNaN(lng)) {
                        updateCoordinates(lat, lng);
                        setIsSearching(false);
                        return;
                    }
                }
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}`);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const { lat, lon } = data[0];
                        updateCoordinates(parseFloat(lat), parseFloat(lon));
                        if (mapInstanceRef.current) mapInstanceRef.current.setZoom(16);
                    } else alert("Location not found");
                } catch (e) { alert("Search failed"); } 
                finally { setIsSearching(false); }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Fix for white screen crash: Use Blob URL instead of Data URL for preview
                if (imagePreview) URL.revokeObjectURL(imagePreview);
                const objectUrl = URL.createObjectURL(file);
                setImagePreview(objectUrl);
                setImageFile(file);

                // Read file separately just for EXIF parsing
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const result = evt.target.result;
                    try {
                        const exifObj = piexif.load(result);
                        setOriginalExif(exifObj);
                        const gps = exifObj['GPS'];
                        if (gps && gps[piexif.GPSIFD.GPSLatitude]) {
                            const convertToDeg = (coord) => coord[0][0]/coord[0][1] + (coord[1][0]/coord[1][1])/60 + (coord[2][0]/coord[2][1])/3600;
                            let lat = convertToDeg(gps[piexif.GPSIFD.GPSLatitude]);
                            let lng = convertToDeg(gps[piexif.GPSIFD.GPSLongitude]);
                            const latRef = gps[piexif.GPSIFD.GPSLatitudeRef];
                            const lngRef = gps[piexif.GPSIFD.GPSLongitudeRef];
                            if (latRef === 'S' || (Array.isArray(latRef) && String.fromCharCode(...latRef).includes('S'))) lat = -lat;
                            if (lngRef === 'W' || (Array.isArray(lngRef) && String.fromCharCode(...lngRef).includes('W'))) lng = -lng;
                            updateCoordinates(lat, lng);
                        }
                    } catch (error) { 
                        console.warn("EXIF Error or not a JPEG", error);
                        setOriginalExif(null); 
                    }
                };
                reader.readAsDataURL(file);
            };

            // --- Camera ---
            const startCamera = async () => {
                setIsCameraLoading(true);
                setIsCameraOpen(true);
                if ('geolocation' in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (p) => updateCoordinates(p.coords.latitude, p.coords.longitude),
                        (e) => alert("Could not detect location. Please enable GPS."),
                        { enableHighAccuracy: true }
                    );
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: cameraFacingMode, width: { ideal: 4096 }, height: { ideal: 2160 } } });
                    if (videoRef.current) videoRef.current.srcObject = stream;
                    streamRef.current = stream;
                } catch (err) { alert("Could not access camera."); setIsCameraOpen(false); } 
                finally { setIsCameraLoading(false); }
            };

            const stopCamera = () => {
                if (streamRef.current) streamRef.current.getTracks().forEach(track => track.stop());
                setIsCameraOpen(false);
            };

            const toggleCameraFacing = () => setCameraFacingMode(prev => prev === 'environment' ? 'user' : 'environment');

            useEffect(() => {
                if (isCameraOpen && streamRef.current) { stopCamera(); setTimeout(() => startCamera(), 100); }
            }, [cameraFacingMode]);

            const capturePhoto = () => {
                if (!videoRef.current) return;
                const video = videoRef.current;
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                if (cameraFacingMode === 'user') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // For camera, dataURL is usually smaller than raw upload, but we can stick to dataURL or blob
                setImagePreview(canvas.toDataURL('image/jpeg', 1.0));
                setImageFile({ name: `capture_${Date.now()}.jpg`, lastModified: Date.now() });
                setOriginalExif(null);
                stopCamera();
            };

            // --- Export ---
            const processAndDownload = async () => {
                if (!imagePreview) return;
                setIsDownloading(true);
                const latNum = parseFloat(coords.lat);
                const lngNum = parseFloat(coords.lng);
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                // Allow cross-origin for blob/data URLs to prevent taint
                img.crossOrigin = "Anonymous";
                
                img.onload = async () => {
                    // Mobile Fix: Cap resolution to 4096 to prevent canvas crash on high-res photos
                    const maxDimension = 4096;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDimension || height > maxDimension) {
                        if (width > height) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    if (overlaySettings.enabled) {
                        // Use calculated width/height for scale factor
                        const scaleFactor = Math.max(width, height) / 2000; 
                        const baseFontSize = 32 * scaleFactor * overlaySettings.fontSize;
                        const padding = 40 * scaleFactor;
                        const lineHeight = baseFontSize * 1.5;
                        const miniMapSize = 250 * scaleFactor;
                        const iconSize = baseFontSize * 0.9;
                        const cardWidth = 850 * scaleFactor; 
                        
                        const totalWidth = overlaySettings.layoutMode === 'footer' ? canvas.width : cardWidth;
                        
                        // Font Setup
                        ctx.font = `${baseFontSize * 0.7}px "JetBrains Mono", monospace`;

                        // Measure Address
                        const textMaxWidth = overlaySettings.includeMap 
                            ? (totalWidth - miniMapSize - (padding * 3.5)) // Extra padding for divider/gap
                            : (totalWidth - (padding * 2));

                        let addressLines = [];
                        if (overlaySettings.showAddress && address) {
                            const words = (address || "Unknown Location").split(' ');
                            let currentLine = words[0];
                            for (let i = 1; i < words.length; i++) {
                                const word = words[i];
                                const width = ctx.measureText(currentLine + " " + word).width;
                                if (width < textMaxWidth - iconSize - 20) { // Account for icon
                                    currentLine += " " + word;
                                } else {
                                    addressLines.push(currentLine);
                                    currentLine = word;
                                }
                            }
                            addressLines.push(currentLine);
                            if(addressLines.length > 3) {
                                addressLines = addressLines.slice(0, 3);
                                addressLines[2] += "...";
                            }
                        }

                        // Calculate Height
                        let activeLines = 0;
                        if(overlaySettings.customText) activeLines += 1.3;
                        if(overlaySettings.showCoords) activeLines += 1;
                        if(overlaySettings.showDate) activeLines += 1;
                        if(overlaySettings.showAddress) activeLines += addressLines.length;

                        const contentHeight = Math.max(
                            overlaySettings.includeMap ? miniMapSize : 0, 
                            (activeLines * lineHeight) + (padding * 0.5) // slight buffer
                        );
                        const totalHeight = contentHeight + (padding * 2);

                        // Position
                        let x = 0;
                        let y = 0;
                        if (overlaySettings.layoutMode === 'footer') {
                            y = canvas.height - totalHeight;
                        } else {
                            const margin = padding; 
                            if (overlaySettings.position.includes('left')) x = margin;
                            else x = canvas.width - cardWidth - margin;
                            if (overlaySettings.position.includes('top')) y = margin;
                            else y = canvas.height - totalHeight - margin;
                        }

                        // Background
                        const rgb = hexToRgb(overlaySettings.bgColor);
                        ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${overlaySettings.bgOpacity / 100})`;
                        
                        if (overlaySettings.layoutMode === 'card') {
                            ctx.beginPath();
                            ctx.roundRect 
                                ? ctx.roundRect(x, y, totalWidth, totalHeight, 20 * scaleFactor) 
                                : ctx.fillRect(x, y, totalWidth, totalHeight);
                            ctx.fill();
                            // Border for Card
                            ctx.strokeStyle = `rgba(255,255,255,0.1)`;
                            ctx.lineWidth = 1 * scaleFactor;
                            ctx.stroke();
                        } else {
                            ctx.fillRect(x, y, totalWidth, totalHeight);
                        }

                        // Content Alignment
                        const mapOnLeft = overlaySettings.mapAlign === 'left';
                        let mapX, textX;
                        
                        if (overlaySettings.includeMap) {
                            if (mapOnLeft) {
                                mapX = x + padding;
                                textX = x + padding + miniMapSize + padding;
                            } else {
                                mapX = x + totalWidth - padding - miniMapSize;
                                textX = x + padding; 
                            }
                        } else {
                            textX = x + padding;
                        }

                        // Draw Map
                        if (overlaySettings.includeMap) {
                            const zoomLevel = 15;
                            const tileCoords = getTileCoords(latNum, lngNum, zoomLevel);
                            const tileX = Math.floor(tileCoords.x);
                            const tileY = Math.floor(tileCoords.y);
                            const subPixelX = (tileCoords.x - tileX) * 256;
                            const subPixelY = (tileCoords.y - tileY) * 256;
                            const tileUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoomLevel}/${tileY}/${tileX}`;

                            try {
                                const mapImg = new Image();
                                mapImg.crossOrigin = "Anonymous"; 
                                await new Promise((resolve, reject) => {
                                    mapImg.onload = resolve; mapImg.onerror = resolve; mapImg.src = tileUrl;
                                });

                                const mapY = y + (totalHeight - miniMapSize) / 2;
                                ctx.save();
                                ctx.beginPath();
                                ctx.roundRect 
                                    ? ctx.roundRect(mapX, mapY, miniMapSize, miniMapSize, 8 * scaleFactor)
                                    : ctx.rect(mapX, mapY, miniMapSize, miniMapSize);
                                ctx.clip();
                                ctx.drawImage(mapImg, mapX, mapY, miniMapSize, miniMapSize);
                                
                                // Pin
                                const pinX = mapX + (subPixelX / 256 * miniMapSize);
                                const pinY = mapY + (subPixelY / 256 * miniMapSize);
                                drawCanvasIcon(ctx, 'location', pinX - (20*scaleFactor), pinY - (36*scaleFactor), 40 * scaleFactor, '#ff0000');
                                ctx.restore();

                                // Map Border
                                ctx.strokeStyle = '#ffffff';
                                ctx.lineWidth = 3 * scaleFactor;
                                ctx.strokeRect(mapX, mapY, miniMapSize, miniMapSize); // Simple rect for border is safer with clip

                            } catch (e) { console.warn("Map tile error", e); }
                        }

                        // Draw Text
                        ctx.fillStyle = overlaySettings.textColor;
                        ctx.textBaseline = 'top';
                        // Justify logic: always align text towards the "center" of the overlay relative to map
                        // But standard Left alignment usually reads best. 
                        // If map is Right, Text Left. If Map Left, Text Right (which is basically Left aligned in its box)
                        // Actually, let's keep text Left aligned always for readability, just change its start X
                        ctx.textAlign = 'left';

                        // Calculate vertical start to center content
                        let textY = y + (totalHeight - (activeLines * lineHeight)) / 2;
                        
                        // Decorative Bar
                        const barX = mapOnLeft ? textX - (padding/2) : (textX + textMaxWidth + (padding/2));
                        // ctx.fillStyle = overlaySettings.accentColor;
                        // ctx.fillRect(barX, textY, 4 * scaleFactor, activeLines * lineHeight);

                        // Project Title
                        if (overlaySettings.customText) {
                            ctx.font = `bold ${baseFontSize}px "JetBrains Mono", monospace`;
                            ctx.fillStyle = overlaySettings.accentColor;
                            ctx.fillText(overlaySettings.customText.toUpperCase(), textX, textY);
                            textY += lineHeight * 1.3;
                            ctx.fillStyle = overlaySettings.textColor;
                        }

                        // Data Lines with Icons
                        const drawDataLine = (iconType, text) => {
                            drawCanvasIcon(ctx, iconType, textX, textY + (lineHeight * 0.15), iconSize, overlaySettings.textColor);
                            ctx.font = `${baseFontSize * 0.75}px "JetBrains Mono", monospace`;
                            ctx.fillText(text, textX + iconSize * 1.5, textY);
                            textY += lineHeight;
                        };

                        if (overlaySettings.showCoords) {
                            drawDataLine('gps', `${latNum.toFixed(6)}, ${lngNum.toFixed(6)}`);
                        }

                        if (overlaySettings.showDate) {
                            const d = overlaySettings.customDate ? new Date(overlaySettings.customDate) : new Date();
                            const dateStr = d.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
                            drawDataLine('date', dateStr);
                        }

                        if (overlaySettings.showAddress && addressLines.length > 0) {
                            drawCanvasIcon(ctx, 'location', textX, textY + (lineHeight * 0.15), iconSize, overlaySettings.textColor);
                            ctx.font = `${baseFontSize * 0.7}px "JetBrains Mono", monospace`;
                            addressLines.forEach(line => {
                                ctx.fillText(line, textX + iconSize * 1.5, textY);
                                textY += lineHeight;
                            });
                        }
                    }

                    // EXIF & Download
                    try {
                        // Use slightly lower quality (0.90) to save memory on mobile devices during base64 conversion
                        const newDataUrl = canvas.toDataURL("image/jpeg", 0.90);
                        let exifObj = { "0th": {}, "Exif": {}, "GPS": {}, "1st": {}, "thumbnail": null };
                        if (originalExif) {
                            if (originalExif["0th"]) for (let tag in originalExif["0th"]) if (parseInt(tag) !== 34853) exifObj["0th"][tag] = originalExif["0th"][tag];
                            if (originalExif["Exif"]) for (let tag in originalExif["Exif"]) exifObj["Exif"][tag] = originalExif["Exif"][tag];
                        }
                        exifObj['GPS'][piexif.GPSIFD.GPSVersionID] = [2, 2, 0, 0];
                        exifObj['GPS'][piexif.GPSIFD.GPSLatitudeRef] = latNum < 0 ? 'S' : 'N';
                        exifObj['GPS'][piexif.GPSIFD.GPSLatitude] = degToDmsRational(latNum);
                        exifObj['GPS'][piexif.GPSIFD.GPSLongitudeRef] = lngNum < 0 ? 'W' : 'E';
                        exifObj['GPS'][piexif.GPSIFD.GPSLongitude] = degToDmsRational(lngNum);
                        const d = overlaySettings.customDate ? new Date(overlaySettings.customDate) : new Date();
                        exifObj['GPS'][piexif.GPSIFD.GPSDateStamp] = `${d.getFullYear()}:${(d.getMonth()+1).toString().padStart(2, '0')}:${d.getDate().toString().padStart(2, '0')}`;
                        exifObj['GPS'][piexif.GPSIFD.GPSTimeStamp] = [ [d.getHours(), 1], [d.getMinutes(), 1], [d.getSeconds(), 1] ];

                        const link = document.createElement('a');
                        link.href = piexif.insert(piexif.dump(exifObj), newDataUrl);
                        link.download = `geotagged_pro_${Date.now()}.jpg`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    } catch (err) { 
                        console.error("Download Error", err);
                        alert("Error generating image. Try a smaller photo."); 
                    } 
                    finally { 
                        setIsDownloading(false); 
                    }
                };
                img.src = imagePreview;
            };

            // --- Render Preview ---
            const getPreviewStyle = () => {
                const base = {
                    backgroundColor: `${overlaySettings.bgColor}${Math.round(overlaySettings.bgOpacity * 2.55).toString(16).padStart(2,'0')}`,
                    color: overlaySettings.textColor,
                    transition: 'all 0.3s ease'
                };
                if (overlaySettings.layoutMode === 'footer') {
                    return {
                        ...base, position: 'absolute', bottom: 0, left: 0, right: 0, width: '100%', padding: '1rem',
                        borderTop: `1px solid ${overlaySettings.textColor}20`, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                        flexDirection: overlaySettings.mapAlign === 'left' ? 'row' : 'row-reverse'
                    };
                } else {
                    const pos = overlaySettings.position; 
                    const style = {
                        ...base, position: 'absolute', padding: '1rem', borderRadius: '1rem', display: 'flex', alignItems: 'center', gap: '1.5rem',
                        justifyContent: 'space-between', flexDirection: overlaySettings.mapAlign === 'left' ? 'row' : 'row-reverse', maxWidth: '90%',
                        border: '1px solid rgba(255,255,255,0.1)'
                    };
                    if (pos.includes('bottom')) style.bottom = '1.5rem'; else style.top = '1.5rem';
                    if (pos.includes('right')) style.right = '1.5rem'; else style.left = '1.5rem';
                    return style;
                }
            };

            return (
                <div className="min-h-screen pb-10 bg-gray-50 relative">
                    
                    {/* Camera Modal */}
                    {isCameraOpen && (
                        <div className="fixed inset-0 z-[100] bg-black flex flex-col">
                            <div className="p-4 flex justify-between items-center bg-black/50 absolute top-0 w-full z-10 backdrop-blur-sm">
                                <span className="text-white font-mono text-sm bg-red-600 px-2 py-0.5 rounded animate-pulse">REC</span>
                                <div className="text-white/80 text-xs font-mono">GPS: {parseFloat(coords.lat).toFixed(6)}, {parseFloat(coords.lng).toFixed(6)}</div>
                                <button onClick={stopCamera} className="text-white p-2 rounded-full hover:bg-white/20"><X size={24} /></button>
                            </div>
                            <div className="flex-1 relative flex items-center justify-center bg-black">
                                {isCameraLoading && <div className="absolute text-white animate-spin">⏳</div>}
                                <video ref={videoRef} autoPlay playsInline className={`max-h-full max-w-full object-contain ${cameraFacingMode === 'user' ? 'scale-x-[-1]' : ''}`} />
                            </div>
                            <div className="h-32 bg-black/80 backdrop-blur-md flex items-center justify-around px-8 pb-8 pt-4">
                                <button onClick={toggleCameraFacing} className="p-3 rounded-full bg-gray-800 text-white"><SwitchCamera size={24} /></button>
                                <button onClick={capturePhoto} className="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center hover:scale-105 active:scale-95 transition-transform"><div className="w-16 h-16 bg-white rounded-full"></div></button>
                                <div className="w-12 h-12"></div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-white border-b sticky top-0 z-50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="p-2 bg-blue-600 rounded-lg text-white"><MapPin size={24} /></div>
                                <h1 className="text-xl font-bold text-gray-900 tracking-tight">GeoTagger <span className="text-blue-600">Pro</span></h1>
                            </div>
                            {imageFile && (
                                <button onClick={processAndDownload} disabled={isDownloading} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white px-5 py-2 rounded-lg font-medium transition-colors shadow-sm">
                                    {isDownloading ? <span className="animate-spin">⏳</span> : <Download size={18} />} {isDownloading ? 'Processing...' : 'Download Image'}
                                </button>
                            )}
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {!imageFile ? (
                            <div className="max-w-xl mx-auto mt-20">
                                <div className="flex flex-col gap-4">
                                    <div className="border-4 border-dashed border-gray-300 rounded-2xl p-12 text-center hover:border-blue-500 hover:bg-blue-50 transition-colors cursor-pointer group bg-white shadow-sm" onClick={() => fileInputRef.current.click()}>
                                        <div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform shadow-inner"><Upload size={32} /></div>
                                        <h3 className="text-xl font-bold text-gray-900 mb-2">Upload a Photo</h3>
                                        <p className="text-gray-500 mb-6">Drag & drop or click to browse.<br/>Supports JPEG, PNG.</p>
                                        <button className="bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">Select Photo</button>
                                    </div>
                                    <div className="relative"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-300"></div></div><div className="relative flex justify-center text-sm"><span className="px-2 bg-gray-50 text-gray-500">OR</span></div></div>
                                    <button onClick={startCamera} className="w-full py-4 bg-gray-900 text-white rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-gray-800 shadow-lg transition-transform hover:scale-[1.01]"><Camera size={24} /> Open Camera</button>
                                </div>
                                <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                <div className="lg:col-span-7 space-y-6">
                                    <div className="bg-gray-900 rounded-xl shadow-lg border border-gray-800 overflow-hidden relative group">
                                        <div className="relative flex items-center justify-center min-h-[500px] bg-neutral-900">
                                            <img src={imagePreview} className="max-w-full max-h-[600px] object-contain" alt="Preview" />
                                            {overlaySettings.enabled && (
                                                <div className="font-mono shadow-2xl backdrop-blur-sm" style={getPreviewStyle()}>
                                                    {overlaySettings.includeMap && (
                                                        <div className="shrink-0 rounded border overflow-hidden relative transition-all duration-300 bg-gray-800" style={{ width: `${6 * overlaySettings.fontSize}rem`, height: `${6 * overlaySettings.fontSize}rem`, borderColor: overlaySettings.textColor }}>
                                                            <img src={`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/15/${Math.floor(getTileCoords(parseFloat(coords.lat), parseFloat(coords.lng), 15).y)}/${Math.floor(getTileCoords(parseFloat(coords.lat), parseFloat(coords.lng), 15).x)}`} className="w-full h-full object-cover opacity-80" alt="Mini Map" />
                                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none"><div className="w-2 h-2 border border-white rounded-full bg-red-500 shadow-sm"></div></div>
                                                        </div>
                                                    )}
                                                    <div className="flex flex-col justify-center space-y-1.5 transition-all duration-300" style={{ fontSize: `${0.75 * overlaySettings.fontSize}rem`, textAlign: 'left' }}>
                                                        {overlaySettings.customText && <div className="font-bold tracking-wide mb-1" style={{ color: overlaySettings.accentColor, fontSize: '1.2em' }}>{overlaySettings.customText.toUpperCase()}</div>}
                                                        {overlaySettings.showCoords && <div className="flex items-center gap-2"><Crosshair size={14}/><span className="font-bold">{parseFloat(coords.lat).toFixed(6)}, {parseFloat(coords.lng).toFixed(6)}</span></div>}
                                                        {overlaySettings.showDate && <div className="flex items-center gap-2"><Calendar size={14}/><span>{(overlaySettings.customDate ? new Date(overlaySettings.customDate) : new Date()).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })}</span></div>}
                                                        {overlaySettings.showAddress && address && <div className="flex items-start gap-2 max-w-[320px]"><MapPin size={14} className="shrink-0 mt-0.5"/><span className="opacity-90">{address}</span></div>}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-xl shadow-sm border p-6">
                                        <div className="flex items-center justify-between mb-6">
                                            <h3 className="text-lg font-bold flex items-center gap-2 text-gray-800"><Settings size={20} className="text-blue-600"/> Overlay Customization</h3>
                                            <label className="relative inline-flex items-center cursor-pointer">
                                                <input type="checkbox" className="sr-only peer" checked={overlaySettings.enabled} onChange={(e) => setOverlaySettings({...overlaySettings, enabled: e.target.checked})} />
                                                <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-100 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                                            </label>
                                        </div>

                                        {overlaySettings.enabled && (
                                            <div className="space-y-6 animate-in fade-in slide-in-from-top-2">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    <div className="col-span-2 space-y-3 p-4 bg-gray-50 rounded-lg border border-gray-100">
                                                        <h4 className="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2"><Layout size={14}/> Layout & Position</h4>
                                                        <div className="flex flex-wrap gap-4">
                                                            <div className="flex bg-white rounded-lg p-1 border shadow-sm">
                                                                <button onClick={() => setOverlaySettings({...overlaySettings, layoutMode: 'footer'})} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${overlaySettings.layoutMode === 'footer' ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}>Footer Bar</button>
                                                                <button onClick={() => setOverlaySettings({...overlaySettings, layoutMode: 'card'})} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${overlaySettings.layoutMode === 'card' ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}>Floating Box</button>
                                                            </div>
                                                            <div className="flex bg-white rounded-lg p-1 border shadow-sm items-center px-2 gap-2">
                                                                <span className="text-xs text-gray-500 font-semibold">Map Side:</span>
                                                                <button onClick={() => setOverlaySettings({...overlaySettings, mapAlign: 'left'})} className={`px-2 py-1 rounded text-xs font-bold ${overlaySettings.mapAlign === 'left' ? 'bg-gray-200 text-gray-900' : 'text-gray-400'}`}>Left</button>
                                                                <button onClick={() => setOverlaySettings({...overlaySettings, mapAlign: 'right'})} className={`px-2 py-1 rounded text-xs font-bold ${overlaySettings.mapAlign === 'right' ? 'bg-gray-200 text-gray-900' : 'text-gray-400'}`}>Right</button>
                                                            </div>
                                                        </div>
                                                        {overlaySettings.layoutMode === 'card' && (
                                                            <div className="flex gap-2 items-center pt-2 border-t border-gray-200 mt-2">
                                                                <span className="text-xs text-gray-500">Corner:</span>
                                                                {['top-left', 'top-right', 'bottom-left', 'bottom-right'].map(pos => (
                                                                    <button key={pos} onClick={() => setOverlaySettings({...overlaySettings, position: pos})} className={`w-6 h-6 border rounded hover:bg-gray-100 ${overlaySettings.position === pos ? 'bg-blue-600 border-blue-600' : 'bg-white'}`} title={pos}>
                                                                        {overlaySettings.position === pos && <div className="w-2 h-2 bg-white rounded-full mx-auto"></div>}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="col-span-2">
                                                        <label className="block text-sm font-semibold text-gray-700 mb-1">Project Name / Header</label>
                                                        <input type="text" value={overlaySettings.customText} onChange={(e) => setOverlaySettings({...overlaySettings, customText: e.target.value})} placeholder="e.g. SITE INSPECTION" className="w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 uppercase font-mono text-sm"/>
                                                    </div>

                                                    <div className="col-span-2">
                                                        <label className="block text-sm font-semibold text-gray-700 mb-1 flex items-center gap-2"><Calendar size={14}/> Custom Date & Time (Override)</label>
                                                        <input type="datetime-local" value={overlaySettings.customDate} onChange={(e) => setOverlaySettings({...overlaySettings, customDate: e.target.value})} className="w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500 font-mono text-sm text-gray-600"/>
                                                    </div>
                                                    
                                                    <div className="flex flex-col gap-2">
                                                        <span className="text-xs font-bold text-gray-500 uppercase tracking-wider">Content</span>
                                                        <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" checked={overlaySettings.includeMap} onChange={(e) => setOverlaySettings({...overlaySettings, includeMap: e.target.checked})} className="rounded text-blue-600"/> Include Mini-Map</label>
                                                        <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" checked={overlaySettings.showCoords} onChange={(e) => setOverlaySettings({...overlaySettings, showCoords: e.target.checked})} className="rounded text-blue-600"/> Show Coordinates</label>
                                                        <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" checked={overlaySettings.showDate} onChange={(e) => setOverlaySettings({...overlaySettings, showDate: e.target.checked})} className="rounded text-blue-600"/> Show Date</label>
                                                        <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" checked={overlaySettings.showAddress} onChange={(e) => setOverlaySettings({...overlaySettings, showAddress: e.target.checked})} className="rounded text-blue-600"/> Show Detected Location</label>
                                                    </div>

                                                    <div className="flex flex-col gap-4">
                                                        <span className="text-xs font-bold text-gray-500 uppercase tracking-wider">Style</span>
                                                        <div className="flex gap-4">
                                                            <div><label className="block text-xs text-gray-500 mb-1">BG</label><input type="color" value={overlaySettings.bgColor} onChange={(e) => setOverlaySettings({...overlaySettings, bgColor: e.target.value})} className="h-8 w-8 rounded cursor-pointer border-0 p-0" /></div>
                                                            <div><label className="block text-xs text-gray-500 mb-1">Opacity</label><input type="range" min="0" max="100" value={overlaySettings.bgOpacity} onChange={(e) => setOverlaySettings({...overlaySettings, bgOpacity: parseInt(e.target.value)})} className="w-20 accent-blue-600" /></div>
                                                            <div><label className="block text-xs text-gray-500 mb-1">Text</label><input type="color" value={overlaySettings.textColor} onChange={(e) => setOverlaySettings({...overlaySettings, textColor: e.target.value})} className="h-8 w-8 rounded cursor-pointer border-0 p-0" /></div>
                                                            <div><label className="block text-xs text-gray-500 mb-1">Header</label><input type="color" value={overlaySettings.accentColor} onChange={(e) => setOverlaySettings({...overlaySettings, accentColor: e.target.value})} className="h-8 w-8 rounded cursor-pointer border-0 p-0" /></div>
                                                        </div>
                                                        <div><label className="block text-xs text-gray-500 mb-1">Size: {overlaySettings.fontSize}x</label><input type="range" min="0.8" max="1.5" step="0.1" value={overlaySettings.fontSize} onChange={(e) => setOverlaySettings({...overlaySettings, fontSize: parseFloat(e.target.value)})} className="w-full accent-blue-600" /></div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="lg:col-span-5 space-y-6">
                                    <div className="bg-white rounded-xl shadow-sm border p-1 overflow-hidden">
                                        <div className="p-3 border-b flex gap-2">
                                            <form onSubmit={handleSearch} className="relative flex-1">
                                                <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search location or coords..." className="w-full pl-9 pr-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none"/>
                                                <Search className="absolute left-2.5 top-2.5 text-gray-400" size={16} />
                                            </form>
                                            <button onClick={() => setMapType(mapType === 'satellite' ? 'street' : 'satellite')} className="px-3 py-2 bg-white border rounded-lg hover:bg-gray-50 text-gray-600 text-sm font-medium flex items-center gap-2" title="Toggle Satellite/Street View"><Layers size={16}/>{mapType === 'satellite' ? 'Sat' : 'Map'}</button>
                                        </div>
                                        <div ref={mapRef} className="h-[350px] w-full z-0" id="map"></div>
                                        <div className="p-3 bg-gray-50 border-t flex justify-between items-center text-xs text-gray-500"><span>Lat: {parseFloat(coords.lat).toFixed(6)}</span><span>Lng: {parseFloat(coords.lng).toFixed(6)}</span></div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border p-6">
                                        <h3 className="text-lg font-bold flex items-center gap-2 mb-4 text-gray-800"><MapIcon size={20} className="text-blue-600"/> GPS Data</h3>
                                        <div className="space-y-4">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Latitude</label><input type="number" value={coords.lat} onChange={(e) => updateCoordinates(e.target.value, coords.lng)} step="any" className="w-full font-mono text-sm border-gray-300 rounded-lg border p-2.5 focus:ring-blue-500 focus:border-blue-500"/></div>
                                                <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Longitude</label><input type="number" value={coords.lng} onChange={(e) => updateCoordinates(coords.lat, e.target.value)} step="any" className="w-full font-mono text-sm border-gray-300 rounded-lg border p-2.5 focus:ring-blue-500 focus:border-blue-500"/></div>
                                            </div>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Detected Location</label><div className="w-full text-sm bg-gray-50 text-gray-700 border-gray-200 rounded-lg border p-3">{address || "No location detected"}</div></div>
                                            <div className="bg-blue-50 border border-blue-100 rounded-lg p-3 flex gap-3"><Info className="text-blue-500 shrink-0" size={18} /><p className="text-xs text-blue-700">Coordinates will be permanently embedded into the EXIF metadata upon download.</p></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
